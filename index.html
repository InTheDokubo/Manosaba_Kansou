<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manosaba Archive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Noto+Sans+JP:wght@300;400;700;900&family=Crimson+Pro:ital,wght@1,400;1,700;1,900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #020202;
            --primary-red: #991b1b;
            --glow-red: rgba(153, 27, 27, 0.35);
            --text-main: #d4d4d8;
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            letter-spacing: 0.01em;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Ambient effects */
        .vignette {
            position: fixed;
            inset: 0;
            box-shadow: inset 0 0 180px rgba(0,0,0,0.95);
            z-index: 5;
            pointer-events: none;
        }

        .bg-glow {
            position: fixed;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, var(--glow-red) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(120px);
            opacity: 0.4;
        }
        .bg-glow-tr { top: -30vw; right: -20vw; }
        .bg-glow-bl { bottom: -30vw; left: -20vw; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #331111; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-red); }

        /* Prose styles */
        .prose { max-width: 100%; color: #b7b7b7; font-size: 1.1rem; line-height: 2; }
        .prose Title, .prose title { display: none; }
        
        .article-header { 
            font-family: 'Crimson Pro', serif;
            color: #ffffff; 
            font-weight: 900; 
            font-size: clamp(2.5rem, 6vw, 4rem); 
            margin-bottom: 4rem; 
            border-left: 4px solid var(--primary-red); 
            padding-left: 2rem; 
            line-height: 1;
            text-shadow: 0 0 30px rgba(153, 27, 27, 0.8);
            font-style: italic;
        }
        
        .prose h1 { color: #ffffff; font-weight: 700; font-size: 2rem; margin-top: 4rem; margin-bottom: 2rem; border-bottom: 1px solid #450a0a; padding-bottom: 0.5rem; }
        .prose h2 { color: #fecaca; font-weight: 600; font-size: 1.5rem; margin-top: 4rem; margin-bottom: 1.5rem; border-left: 5px solid #7f1d1d; padding-left: 1.5rem; }
        .prose p { margin-bottom: 2rem; text-align: justify; }
        .prose ul { list-style-type: none; margin-bottom: 2.5rem; }
        .prose ul li { position: relative; padding-left: 2rem; margin-bottom: 1rem; }
        .prose ul li::before { content: "†"; position: absolute; left: 0; color: #991b1b; font-weight: 900; }
        .prose blockquote { border-left: 3px solid #991b1b; padding: 1.5rem 2.5rem; font-style: italic; color: #9ca3af; background: rgba(15, 5, 5, 0.7); margin-bottom: 2.5rem; }

        /* Animations */
        @keyframes fadeInReveal {
            from { opacity: 0; transform: translateY(20px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .animate-reveal { animation: fadeInReveal 1s cubic-bezier(0.19, 1, 0.22, 1) forwards; }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(1.05); }
        }
        .pulse-glow { animation: pulseGlow 10s infinite ease-in-out; }

        /* Card styles */
        .article-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            overflow: hidden;
        }
        .article-card:hover {
            border-color: var(--primary-red);
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(153, 27, 27, 0.2);
        }
        .article-card img {
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .article-card:hover img {
            transform: scale(1.1);
        }

        .back-btn {
            font-family: 'Crimson Pro', serif;
            letter-spacing: 0.2em;
            transition: all 0.3s;
        }
        .back-btn:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--primary-red);
        }

        .modal-blur { 
            backdrop-filter: blur(20px) brightness(0.2); 
            background: rgba(0, 0, 0, 0.85);
        }
    </style>
</head>
<body class="min-h-screen relative">

    <div class="bg-glow bg-glow-tr pulse-glow"></div>
    <div class="bg-glow bg-glow-bl pulse-glow"></div>
    <div class="vignette"></div>

    <!-- Entrance Modal (警告画面) -->
    <div id="disclaimerModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-blur hidden">
        <div class="bg-[#080404] border border-red-950/50 p-8 md:p-16 rounded-sm max-w-2xl w-full shadow-[0_0_150px_rgba(153,27,27,0.3)] text-center relative overflow-hidden animate-reveal">
            <div class="w-20 h-20 bg-red-950/20 text-red-700 rounded-full flex items-center justify-center mx-auto mb-8 border border-red-900/20 shadow-[0_0_40px_rgba(153,27,27,0.4)]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h2 class="text-3xl md:text-5xl font-black text-white mb-6 tracking-[0.4em] uppercase italic leading-none" style="font-family: 'Crimson Pro', serif;">Warning</h2>
            
            <div class="text-zinc-400 space-y-6 text-left mb-10 max-w-lg mx-auto font-light leading-relaxed">
                <div class="bg-red-950/20 p-6 border-l-[4px] border-red-800 text-zinc-100 space-y-4">
                    <p class="font-bold tracking-widest">● 魔法少女の魔女裁判のネタバレ</p>
                    <p class="font-bold tracking-widest text-sm opacity-90">● 個人による感想</p>
                    <p class="font-bold tracking-widest text-sm opacity-90 leading-normal">● キャラ愛を持つ人に怒りを抱かれかねない危険性</p>
                </div>
                <p class="text-[11px] uppercase tracking-[0.2em] text-center opacity-50">以上の事項を理解した上で入場してください</p>
            </div>

            <button id="enterBtn" class="w-full bg-red-950/80 text-white text-xl md:text-2xl font-black py-6 border border-red-700/30 hover:bg-red-800 hover:shadow-[0_0_40px_rgba(153,27,27,0.6)] transition-all duration-700 tracking-[0.6em] uppercase">
                入場する
            </button>
        </div>
    </div>

    <!-- Home: Grid Portal -->
    <main id="portalPage" class="relative z-10 min-h-screen px-6 py-20 max-w-7xl mx-auto">
        <header class="text-center mb-24 animate-reveal">
            <h1 class="text-4xl md:text-6xl font-black italic tracking-[0.5em] text-white uppercase mb-4" style="font-family: 'Crimson Pro', serif;">Manosaba Archive</h1>
            <p class="text-[10px] text-red-900 font-black uppercase tracking-[0.8em] opacity-70"></p>
        </header>

        <div id="articleGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 md:gap-10">
            <!-- Dynamic Cards -->
            <div class="col-span-full text-center py-20 text-zinc-800 tracking-[0.5em] animate-pulse">Initializing Archive...</div>
        </div>
    </main>

    <!-- Reading Mode: Full Screen -->
    <main id="readingPage" class="hidden relative z-10 min-h-screen bg-[#020202]">
        <nav class="fixed top-0 left-0 w-full p-8 z-20 flex justify-between items-center pointer-events-none">
            <button id="backToList" class="back-btn text-xs font-bold text-zinc-600 uppercase pointer-events-auto flex items-center gap-4 group">
                <span class="group-hover:-translate-x-2 transition-transform">←</span> Return to Archive
            </button>
            <div class="text-[10px] text-red-900 font-black tracking-widest opacity-30 uppercase">Record No. <span id="recordID">00</span></div>
        </nav>

        <div id="loadingBar" class="fixed top-0 left-0 w-0 h-[2px] bg-red-700 transition-all duration-1000 z-[60] opacity-0 shadow-[0_0_15px_#991b1b]"></div>
        
        <article class="max-w-4xl mx-auto px-10 py-40 md:px-24 md:py-60">
            <div id="articleContainer">
                <h1 id="articleTitle" class="article-header"></h1>
                <div id="markdownArea" class="prose"></div>
                <div class="mt-40 pt-20 border-t border-red-950/10 text-center opacity-10">
                    <span class="text-[40px] font-thin">†</span>
                </div>
            </div>
        </article>
    </main>

    <script>
        /**
         * 【記事とサムネイルの設定】
         * thumbプロパティを省略すると、自動的に「ファイル名.jpg」を参照します。
         */
        const MD_FILES = [
            { file: '01 レイア処刑.md', thumb: '01.jpg' }
            { file: '02 １話細かいところ.md', thumb: '02.jpg' }
        ];

        const DATA_PATH = './Data/';
        const STORAGE_KEY = 'witch_trial_access_granted_v2';

        const portalPage = document.getElementById('portalPage');
        const readingPage = document.getElementById('readingPage');
        const articleGrid = document.getElementById('articleGrid');
        const articleTitle = document.getElementById('articleTitle');
        const markdownArea = document.getElementById('markdownArea');
        const loadingBar = document.getElementById('loadingBar');
        const disclaimerModal = document.getElementById('disclaimerModal');
        const enterBtn = document.getElementById('enterBtn');
        const backToList = document.getElementById('backToList');

        function checkEntrance() {
            if (!localStorage.getItem(STORAGE_KEY)) {
                disclaimerModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
        }

        enterBtn.addEventListener('click', () => {
            localStorage.setItem(STORAGE_KEY, 'true');
            disclaimerModal.classList.add('hidden');
            document.body.style.overflow = '';
        });

        async function initPortal() {
            articleGrid.innerHTML = '';
            
            const results = await Promise.all(MD_FILES.map(async (item, index) => {
                const filename = typeof item === 'string' ? item : item.file;
                const explicitThumb = typeof item === 'object' ? item.thumb : null;

                try {
                    const response = await fetch(DATA_PATH + filename + '?t=' + Date.now());
                    if (!response.ok) throw new Error();
                    const text = await response.text();
                    const match = text.match(/<Title>(.*?)<\/Title>/i);
                    const title = match ? match[1] : filename;
                    
                    // サムネイルの決定
                    const thumbSrc = explicitThumb 
                        ? DATA_PATH + explicitThumb 
                        : DATA_PATH + filename.replace(/\.md$/i, '.jpg');

                    return { filename, title, thumbSrc, index: index + 1 };
                } catch (e) {
                    return { filename, title: filename, thumbSrc: '', index: index + 1, error: true };
                }
            }));

            results.forEach(file => {
                const card = document.createElement('div');
                card.className = "article-card animate-reveal cursor-pointer group aspect-square";
                card.onclick = () => loadMarkdown(file.filename, file.title, file.index);
                
                card.innerHTML = `
                    <div class="w-full h-full relative">
                        <img src="${file.thumbSrc}" alt="" class="w-full h-full object-cover opacity-40 group-hover:opacity-80 transition-opacity" 
                             onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden')">
                        <div class="hidden absolute inset-0 flex items-center justify-center text-red-950 font-thin text-6xl">†</div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
                        <div class="absolute bottom-0 left-0 p-4 md:p-6 w-full">
                            <span class="text-[9px] text-red-700 font-black tracking-widest block mb-1 uppercase">Record ${String(file.index).padStart(2, '0')}</span>
                            <h3 class="text-xs md:text-sm font-bold text-white tracking-widest leading-relaxed uppercase">${file.title}</h3>
                        </div>
                    </div>
                `;
                articleGrid.appendChild(card);
            });
        }

        async function loadMarkdown(filename, title, index) {
            portalPage.classList.add('hidden');
            readingPage.classList.remove('hidden');
            window.scrollTo(0, 0);
            
            loadingBar.style.opacity = '1';
            loadingBar.style.width = '30%';
            document.getElementById('recordID').innerText = String(index).padStart(2, '0');

            try {
                const response = await fetch(DATA_PATH + filename);
                loadingBar.style.width = '70%';
                if (!response.ok) throw new Error();
                
                let text = await response.text();
                loadingBar.style.width = '100%';

                articleTitle.innerText = title;
                const cleanText = text.replace(/<Title>.*?<\/Title>/gi, '');
                markdownArea.innerHTML = marked.parse(cleanText);

            } catch (err) {
                articleTitle.innerText = "Error";
                markdownArea.innerHTML = "<p>記録の復元に失敗しました。</p>";
            } finally {
                setTimeout(() => {
                    loadingBar.style.opacity = '0';
                    loadingBar.style.width = '0%';
                }, 1000);
            }
        }

        backToList.addEventListener('click', () => {
            readingPage.classList.add('hidden');
            portalPage.classList.remove('hidden');
            window.scrollTo(0, 0);
        });

        window.onload = () => {
            initPortal();
            checkEntrance();
        };
    </script>
</body>
</html>
